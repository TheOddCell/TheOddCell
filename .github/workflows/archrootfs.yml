name: arch-rootfs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      PACKAGE_URL: https://git.tarxz.zip/api/packages/odd/generic/arch/latest/latest.tar.xz
    steps:
      - name: Install tooling
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm arch-install-scripts xz

      - name: Build rootfs
        run: |
          mkdir /rootfs
          pacstrap -c -K /rootfs base nano networkmanager busybox
          systemctl --root=/rootfs enable NetworkManager
          # add odd's repo inside the rootfs and install r00t from it
          ls -l /rootfs/etc/pacman.conf* || true
          [ -f /rootfs/etc/pacman.conf ] || cp /etc/pacman.conf /rootfs/etc/pacman.conf
          arch-chroot /rootfs pacman-key --populate archlinux
          curl -fsSL -o /rootfs/sign.gpg https://git.tarxz.zip/api/packages/odd/arch/repository.key
          arch-chroot /rootfs pacman-key --add /sign.gpg
          arch-chroot /rootfs pacman-key --lsign-key 'odd@noreply.git.tarxz.zip'
          rm -f /rootfs/sign.gpg
          cat >>/rootfs/etc/pacman.conf <<'EOF'
          [odd.git.tarxz.zip]
          SigLevel = Required
          Server = https://git.tarxz.zip/api/packages/odd/arch/aur/$arch
          EOF
          arch-chroot /rootfs pacman -Syyu --noconfirm
          arch-chroot /rootfs pacman -S --noconfirm r00t
          # trim the rootfs so the tarball stays under cloudflare's 100 MB upload limit
          rm -rf /rootfs/var/cache/pacman/pkg/* /rootfs/var/lib/pacman/sync/*
          rm -rf /rootfs/usr/share/{doc,man,info,gtk-doc}
          find /rootfs/usr/share/locale -mindepth 1 -maxdepth 1 ! -name locale.alias -exec rm -rf {} +
          tar --numeric-owner --xattrs --acls -C /rootfs -cpf - . | xz -T0 -9e > arch.tar.xz
          ls -lh arch.tar.xz
          size=$(stat -c %s arch.tar.xz)
          if [ "$size" -ge 100000000 ]; then
            echo "arch.tar.xz is $size bytes, over cloudflare's 100 MB limit, drop packages from the pacstrap line" >&2
            exit 1
          fi

      - name: Upload to Forgejo
        shell: bash
        run: |
          upload() {
            rm -f headers.txt body.txt
            curl -sS --http1.1 -D headers.txt -o body.txt -w '%{http_code}' \
              --user "odd:${FORGEJO_TOKEN}" \
              --upload-file arch.tar.xz \
              "$PACKAGE_URL"
          }

          show() {
            if [ -f headers.txt ]; then
              echo "--- response headers" >&2
              cat headers.txt >&2
            fi
            if [ -f body.txt ]; then
              echo "--- response body" >&2
              head -c 2000 body.txt >&2
              echo >&2
            fi
          }

          for attempt in 1 2 3; do
            code=$(upload) || true
            if [ "$code" = 409 ]; then
              echo "409 from upload, deleting the existing file and retrying"
              curl -sS -f -X DELETE --user "odd:${FORGEJO_TOKEN}" "$PACKAGE_URL" || echo "delete failed" >&2
              code=$(upload) || true
            fi

            case "$code" in
              2??)
                echo "uploaded ($code)"
                exit 0
                ;;
              5?? | 000)
                echo "attempt $attempt: got $code" >&2
                show
                sleep 20
                ;;
              *)
                echo "upload failed with $code" >&2
                show
                exit 1
                ;;
            esac
          done

          echo "giving up after 3 attempts" >&2
          exit 1
