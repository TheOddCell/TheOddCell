# .github/workflows/aur-build-push.yml
#
# weekly: builds every package the AUR_MAINTAINER account maintains on the
# AUR (skipping -bin ones, since there's no source to build, plus any
# package with "obsidian" or "obos" in its name, and naevi-git) and pushes
# it to your forgejo arch package registry, one parallel job per package.
# the obsidian/obos packages are built separately, by
# aur-build-push-obsidianos.yml.
# -git packages are built too, so they'll pick up upstream's latest commit
# each run. -debug split packages are built but never uploaded. if a
# package depends on other AUR packages
# (not in the official repos), those are built and installed first, inside
# the same job, before the package itself is built.
#
# needs:
#   - a repo secret FORGEJO_TOKEN: a forgejo access token (or password) for
#     the account that owns the arch repo, with package write access
#
# always builds and pushes; it does not check whether that version is
# already published (forgejo's docs don't say what a duplicate push does).
#
# untested as a whole: i don't have a runner to try this on, so the new
# dependency handling in particular comes from the error you pasted, not
# from a real run.

name: Build and push AUR packages

on:
  schedule:
    - cron: "0 6 * * 1" # every monday, 06:00 utc
  workflow_dispatch: {} # lets you trigger it by hand from the actions tab

env:
  FORGEJO_URL: https://git.tarxz.zip
  FORGEJO_OWNER: odd
  FORGEJO_GROUP: aur # the "group" in /api/packages/{owner}/arch/{group}
  AUR_MAINTAINER: theoddcell # your AUR account name

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Fetch package list from AUR
        id: list
        run: |
          set -euo pipefail
          # skip -bin (prebuilt binary) packages, there's no source to build.
          # also skip anything with "obsidian" or "obos" in the name, and naevi-git specifically.
          packages="$(curl -fsS "https://aur.archlinux.org/rpc/v5/search/$AUR_MAINTAINER?by=maintainer" \
            | jq -c '[.results[].Name
                | select(endswith("-bin") | not)
                | select(test("obsidian|obos"; "i") | not)
                | select(. != "naevi-git")]')"
          count="$(echo "$packages" | jq 'length')"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "found $count package(s) to build for $AUR_MAINTAINER:"
          echo "$packages" | jq -r '.[]'

  build:
    needs: list
    # an empty matrix is an error in actions, so skip when there's nothing to build
    if: needs.list.outputs.count != '0'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash # the container's default is sh, and the script below needs bash
    strategy:
      fail-fast: false # one failing package doesn't cancel the others
      matrix:
        pkg: ${{ fromJSON(needs.list.outputs.packages) }}
    steps:
      - name: Install prerequisites
        run: |
          pacman -Syu --noconfirm --needed git curl wget sudo jq

      - name: Add odd arch repo
        # so dependencies already published there can be pulled by pacman
        # instead of being rebuilt from the aur
        run: |
          set -euo pipefail
          wget -O sign.gpg https://git.tarxz.zip/api/packages/odd/arch/repository.key
          pacman-key --add sign.gpg
          pacman-key --lsign-key 'odd@noreply.git.tarxz.zip'
          cat >> /etc/pacman.conf <<'EOF'

          [odd.git.tarxz.zip]
          SigLevel = Required
          Server = https://git.tarxz.zip/api/packages/odd/arch/aur/$arch
          EOF
          pacman -Sy

      - name: Create build user
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Build ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          BUILD_ROOT=/tmp/build
          mkdir -p "$BUILD_ROOT"
          chown builder:builder "$BUILD_ROOT"
          declare -A DONE=()

          # is this a dependency the official repos can satisfy?
          in_official_repos() {
            pacman -Sp --noconfirm "$1" >/dev/null 2>&1
          }

          # names of everything an aur package depends on, without version constraints
          aur_deps() {
            curl -fsSg "https://aur.archlinux.org/rpc/v5/info?arg[]=$1" \
              | jq -r '.results[0] | ((.Depends // []) + (.MakeDepends // []) + (.CheckDepends // []))[]' \
              | sed 's/[<>=].*//' | sort -u
          }

          # is it an aur package at all?
          in_aur() {
            [ "$(curl -fsSg "https://aur.archlinux.org/rpc/v5/info?arg[]=$1" | jq '.resultcount')" -gt 0 ]
          }

          # non-debug package files in a directory
          package_files() {
            for f in "$1"/*.pkg.tar.zst; do
              [ -e "$f" ] || continue
              pkgname="$(pacman -Qip "$f" | awk '/^Name/ {print $3}')"
              case "$pkgname" in *-debug) continue ;; esac
              echo "$f"
            done
          }

          # build an aur package into $BUILD_ROOT/<name>, building and
          # installing its aur-only dependencies first
          build_pkg() {
            local name="$1" dep dir="$BUILD_ROOT/$1"
            [ -n "${DONE[$name]:-}" ] && return 0
            DONE[$name]=1

            for dep in $(aur_deps "$name"); do
              in_official_repos "$dep" && continue
              if in_aur "$dep"; then
                echo "$name needs $dep from the aur, building it first"
                build_pkg "$dep"
                package_files "$BUILD_ROOT/$dep" | xargs -r pacman -U --noconfirm --needed
              else
                echo "warning: can't find $dep in the official repos or the aur"
              fi
            done

            rm -rf "$dir"
            mkdir -p "$dir"
            chown builder:builder "$dir"
            sudo -u builder git clone --depth 1 "https://aur.archlinux.org/$name.git" "$dir"

            # build without installing, don't sign (forgejo signs its own copy)
            sudo -u builder bash -c "cd '$dir' && makepkg --syncdeps --noconfirm --nosign --skippgpcheck --clean"
          }

          build_pkg "${{ matrix.pkg }}"

      - name: Push ${{ matrix.pkg }} to forgejo
        run: |
          set -euo pipefail
          dir="/tmp/build/${{ matrix.pkg }}"

          for file in "$dir"/*.pkg.tar.zst; do
            [ -e "$file" ] || continue

            # skip -debug split packages
            pkgname="$(pacman -Qip "$file" | awk '/^Name/ {print $3}')"
            case "$pkgname" in *-debug) echo "skipping debug package $(basename "$file")"; continue ;; esac

            echo "publishing $(basename "$file")"
            status="$(curl -sS -o /tmp/upload-response.txt -w '%{http_code}' -X PUT \
              "$FORGEJO_URL/api/packages/$FORGEJO_OWNER/arch/$FORGEJO_GROUP" \
              --user "$FORGEJO_OWNER:$FORGEJO_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$file")"

            case "$status" in
              2*) echo "published" ;;
              409) echo "already published (409), skipping" ;;
              *)
                echo "upload failed with http $status:"
                cat /tmp/upload-response.txt
                exit 1
                ;;
            esac
          done
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
