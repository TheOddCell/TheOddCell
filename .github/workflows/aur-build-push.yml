# .github/workflows/aur-build-push.yml
#
# weekly: builds every non-"-git" package listed in aur-packages.txt and
# pushes it to your forgejo arch package registry. always builds and
# pushes; it does not check whether that version is already published
# (forgejo's own docs don't say what a duplicate push does, so watch the
# first run's logs to see whether it errors or just overwrites).
#
# needs:
#   - a repo secret FORGEJO_TOKEN: a forgejo access token (or password) for
#     the account that owns the arch repo, with package write access
#   - a file aur-packages.txt at the repo root, one aur package name per line
#     (comments starting with # and blank lines are ignored)
#
# untested: i don't have a forgejo instance or an aur package to run this
# against, so the api paths come from forgejo's docs, not a real run.

name: Build and push AUR packages

on:
  schedule:
    - cron: "0 6 * * 1" # every monday, 06:00 utc
  workflow_dispatch: {} # lets you trigger it by hand from the actions tab

env:
  FORGEJO_URL: https://git.tarxz.zip
  FORGEJO_OWNER: odd
  FORGEJO_GROUP: aur # the "group" in /api/packages/{owner}/arch/{group}
  ARCH: x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install prerequisites
        run: |
          pacman -Sy --noconfirm --needed git curl sudo

      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build user
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build and push each package
        run: |
          set -euo pipefail

          while IFS= read -r pkg; do
            pkg="$(echo "$pkg" | sed 's/#.*//;s/[[:space:]]*$//')"
            [ -z "$pkg" ] && continue
            case "$pkg" in
              *-git) echo "skipping VCS package: $pkg"; continue ;;
            esac

            echo "::group::$pkg"

            workdir="/tmp/build/$pkg"
            rm -rf "$workdir"
            mkdir -p "$workdir"

            sudo -u builder git clone --depth 1 "https://aur.archlinux.org/$pkg.git" "$workdir"

            # build without installing, don't sign (forgejo signs its own copy)
            sudo -u builder bash -c "cd '$workdir' && makepkg --syncdeps --noconfirm --nosign --skippgpcheck --clean"

            for file in "$workdir"/*.pkg.tar.zst; do
              [ -e "$file" ] || continue
              fname="$(basename "$file")"

              echo "publishing $fname"
              curl -fsS -X PUT \
                "$FORGEJO_URL/api/packages/$FORGEJO_OWNER/arch/$FORGEJO_GROUP" \
                --user "$FORGEJO_OWNER:$FORGEJO_TOKEN" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@$file"
            done

            echo "::endgroup::"
          done < aur-packages.txt
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
